# ─────────────────────────────────────────────────────────────────────────────────────────────
# IDENTITÉ DE LA BOUTIQUE : l'unique endroit où se trouvent les informations de l'entreprise.
# Elles alimentent les factures et avoirs, les e-mails, les mentions légales, les CGV, la politique de
# confidentialité, le pied de page et la page contact. Pour une autre boutique : on change ce fichier,
# pas le code. (Plus tard : écran « Paramètres de la boutique » dans l'administration.)
#
# ⚠ Les valeurs ci-dessous sont FICTIVES (exemple). À remplacer par les vraies informations avant la mise
#   en ligne, puis à faire relire par un comptable (TVA) et un juriste (CGV, mentions légales).
# ─────────────────────────────────────────────────────────────────────────────────────────────
parameters:
    # BOUTIQUE_MODE_DEMO=0 (variable d'environnement) pour passer en mode réel ; 1 par défaut (sécurité).
    env(BOUTIQUE_MODE_DEMO): '1'

    # Fonctions optionnelles : désactivées par défaut (rien n'est supprimé : tables et données sont conservées).
    # Elles seront reconstruites avec un vrai circuit (avis vérifiés, fidélité réelle...) ; chaque client pourra les activer.
    env(BOUTIQUE_FONCTION_FAVORIS): '0'
    env(BOUTIQUE_FONCTION_AVIS): '0'
    env(BOUTIQUE_FONCTION_POINTS_FIDELITE): '0'

    boutique:
        # Quand mode_demo est actif : bandeau « Version de démonstration » sur le site et filigrane
        # « Document de démonstration, sans valeur fiscale » sur les factures et les avoirs.
        # Quand il est inactif, tout est réel.
        mode_demo: '%env(bool:BOUTIQUE_MODE_DEMO)%'

        # Fonctions optionnelles (1 = visible, 0 = masquée)
        fonctions:
            favoris: '%env(bool:BOUTIQUE_FONCTION_FAVORIS)%'
            avis: '%env(bool:BOUTIQUE_FONCTION_AVIS)%'
            points_fidelite: '%env(bool:BOUTIQUE_FONCTION_POINTS_FIDELITE)%'

        nom_marque: 'Perline Cookies'
        raison_sociale: 'Perline Cookies SAS (exemple)'
        forme_juridique: 'SAS'
        capital: '10 000 €'
        siret: '000 000 000 00000'
        rcs: 'RCS Exemple-Ville B 000 000 000'
        tva_intracommunautaire: 'FR00 000000000'
        adresse_rue: '1 rue de l''Exemple'
        adresse_code_postal: '00000'
        adresse_ville: 'Exemple-Ville'
        adresse_pays: 'France'
        telephone: ''
        site_web: 'perlinecookies.com'
        email_contact: 'contact@exemple.invalid'
        # Adresse qui reçoit les alertes de l'administration (commande payée, stock faible). Vide = e-mail de contact.
        email_alertes: ''
        # Alerte de stock : envoyée UNE fois quand le stock d'un cookie passe SOUS le seuil (global, ou propre au produit si renseigné).
        stock_seuil_global: 5
        email_expediteur: 'noreply@exemple.invalid'
        nom_expediteur: 'Perline Cookies'
        directeur_publication: 'Prénom Nom (exemple)'
        mediateur: 'À renseigner (médiateur de la consommation : nom, adresse postale, site internet)'
        # Pages légales : hébergeur réel, horaires du service client, traces d'allergènes de l'atelier, service d'e-mails, date de mise à jour
        hebergeur_nom: 'Hetzner Online GmbH'
        hebergeur_adresse: 'Industriestr. 25, 91710 Gunzenhausen, Allemagne'
        hebergeur_site: 'https://www.hetzner.com'
        hebergeur_pays_donnees: 'Finlande (Union européenne)'
        service_emails: 'À renseigner (service d''envoi d''e-mails transactionnels)'
        horaires_service_client: 'Du lundi au vendredi, de 9h à 18h'
        traces_atelier: 'gluten (blé), œufs, lait, fruits à coque (noix, noisettes, amandes, noix de macadamia), soja'
        date_maj_pages_legales: '17 novembre 2026'
