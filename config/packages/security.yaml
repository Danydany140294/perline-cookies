security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator

            stateless: false
            user_checker: App\Security\VerifieEmailChecker

            logout:
                path: app_logout
                target: app_home

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    session_fixation_strategy: migrate

    # Un administrateur a aussi les droits du gestionnaire. ROLE_ADMIN ne s'attribue que par pp:promote-admin ;
    # l'administration ne peut donner ou retirer que ROLE_GESTIONNAIRE (commandes, stock, catalogue).
    role_hierarchy:
        ROLE_ADMIN: [ROLE_GESTIONNAIRE]

    access_control:
    # Rubriques réservées à l'administrateur (refus 403 par la sécurité Symfony : la page d'erreur d'EasyAdmin plante sur un refus de permission d'entité)
    - { path: '^/admin/(user|journal-admin|panier|ligne-panier|export|parametres)(/|$)', roles: ROLE_ADMIN }
    - { path: ^/admin, roles: ROLE_GESTIONNAIRE }
    - { path: ^/user/mon-compte, roles: ROLE_USER }
    - { path: ^/user, roles: ROLE_ADMIN }
    - { path: ^/profile, roles: ROLE_USER }