twig:
    default_path: '%kernel.project_dir%/templates'
    cache: false
    globals:
        # Réglages de livraison (frais, seuil, transporteur, modes, zone) disponibles dans tous les templates
        livraison: '@app.vue_livraison'
        # Identité de l'entreprise et mode démo (config/boutique.yaml)
        boutique: '@app.vue_boutique'

when@test:
    twig:
        strict_variables: true
