framework:
    rate_limiter:
        login:
            policy: sliding_window
            limit: '%env(int:LOGIN_LIMITE)%'   # 5 par defaut (voir services.yaml) ; releve uniquement pour les tests E2E
            interval: '15 minutes'
        contact:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        verification_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
