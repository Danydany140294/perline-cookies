# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'

    # Adresse qui reçoit les messages du formulaire de contact (valeur à ajuster)
    contact_email: 'Perlecook@perline-cookies.com'

    # Réglages par défaut des deux modes (surchargeables par variable d'environnement, sans toucher au code) :
    # LIVRAISON_DOMICILE_ACTIF=0 masque la livraison, LIVRAISON_RETRAIT_ACTIF=0 masque le retrait sur place.
    env(LOGIN_LIMITE): '5'
    env(LIVRAISON_DOMICILE_ACTIF): '1'
    env(LIVRAISON_RETRAIT_ACTIF): '1'
    # Produits frais : jours d'expédition (1 = lundi ... 7 = dimanche, séparés par des virgules) et jours de fermeture
    # (dates AAAA-MM-JJ ou plages AAAA-MM-JJ/AAAA-MM-JJ, séparées par des virgules). Modifiables sans toucher au code.
    env(LIVRAISON_JOURS_EXPEDITION): '1,2,3'
    env(LIVRAISON_FERMETURES): ''

    # Livraison (décisions du 11 novembre 2026) : UNE seule source pour les frais, les zones et les modes.
    # Ces valeurs alimentent le calcul serveur, les pages (panier, paiement) ET les CGV.
    livraison:
        transporteur: 'Colissimo'
        suivi_url: 'https://www.laposte.fr/outils/suivre-vos-envois?code={numero}'   # lien de suivi du colis
        modes:
            livraison: '%env(bool:LIVRAISON_DOMICILE_ACTIF)%'
            retrait: '%env(bool:LIVRAISON_RETRAIT_ACTIF)%'
        frais_forfait_centimes: 450       # forfait : 4,50 €
        seuil_gratuite_centimes: 5000     # offerte dès 50,00 € d'articles
        zone:
            pays: 'France'
            departements_exclus: ['20', '97', '98']   # Corse, DOM-TOM : pas encore desservis
        # Délais (décidés le 11 novembre 2026) : préparation 48 h ouvrées, puis 2 à 5 jours ouvrés Colissimo
        delais:
            preparation_jours_ouvres: 2
            transit_min_jours_ouvres: 2
            transit_max_jours_ouvres: 5
            jours_ouvres: [1, 2, 3, 4, 5]                          # lundi à vendredi
            jours_expedition: '%env(csv:LIVRAISON_JOURS_EXPEDITION)%'  # par défaut lundi, mardi, mercredi : un colis ne dort pas le week-end en entrepôt
            fermetures: '%env(csv:LIVRAISON_FERMETURES)%'
    # Retrait sur place : VALEURS PROVISOIRES, à remplacer (affichées sur la page de paiement
    # et dans l'e-mail de confirmation). Ce ne sont pas des secrets.
    retrait:
        lieu: 'Atelier Perline'
        adresse: 'À définir, Montpellier'
        horaires: 'Du mardi au samedi, 10h-18h'
        message: 'Commande prête sous 24 h. Présentez votre numéro de commande.'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # force les contrôleurs à être reconnus comme services
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']
        autowire: true
        autoconfigure: true

    App\Security\LoginFormAuthenticator:
        arguments:
            $loginLimiter: '@limiter.login'