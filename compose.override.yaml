services:
###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP : MAILER_DSN=smtp://127.0.0.1:1025
      - "8025:8025"   # Interface web : http://127.0.0.1:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
